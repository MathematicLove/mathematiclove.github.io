<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting to portfolio…</title>
  <link rel="canonical" href="https://mathematiclove.github.io/my-cv/">
  <noscript><meta http-equiv="refresh" content="0; url=https://mathematiclove.github.io/my-cv/"></noscript>
  <!-- Yandex Webmaster verification -->
  <meta name="yandex-verification" content="518a9f955653cf26" />
  <style>
    :root { color-scheme: light dark; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #57606a; background: #fff;
    }
    @media (prefers-color-scheme: dark) { body { color: #9198a1; background: #0d1117; } }
  </style>
  <script>
    // Count root visits (shown on my-cv/stats), then redirect.
    // sendBeacon survives the navigation, so the hit isn't lost.
    (function () {
      var url = "https://countapi.mileshilliard.com/api/v1/hit/mathematiclove-root-views";
      // Skip search engines, link-preview bots and headless/automated browsers.
      var isBot = navigator.webdriver ||
        /bot|crawl|spider|slurp|yandex|google|bing|duckduck|baidu|preview|headless|lighthouse|facebookexternalhit|telegram|whatsapp/i
          .test(navigator.userAgent);

      function go() {
        if (!isBot) {
          try {
            if (!(navigator.sendBeacon && navigator.sendBeacon(url))) {
              fetch(url, { mode: "no-cors", keepalive: true }).catch(function () {});
            }
          } catch (e) {}
        }
        location.replace("https://mathematiclove.github.io/my-cv/");
      }

      // Chrome may prerender the page while the address is being typed;
      // count only once the visitor actually opens it.
      if (document.prerendering) {
        document.addEventListener("prerenderingchange", go, { once: true });
      } else {
        go();
      }
    })();
  </script>
</head>
<body>
  <p>Redirecting to portfolio…</p>
</body>
</html>
